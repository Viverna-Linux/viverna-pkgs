[metadata]
source-url = "https://ftp.gnu.org/gnu/gcc/gcc-14.2.0/gcc-14.2.0.tar.xz"
bootstrap-version = true
bootstrap-oneshot = true

[build]
configure = '''
cd gcc-14.2.0 || fail
mkdir -v build || fail
cd build || fail
../libstdc++-v3/configure \
--host=$CROSS_TARGET \
--build=$(../config.guess) \
--prefix=/usr \
--disable-multilib \
--disable-nls \
--disable-libstdcxx-pch \
--with-gxx-include-dir=/tools/$CROSS_TARGET/include/c++/14.2.0
'''
build = '''
cd gcc-14.2.0/build || fail
make -j$(nproc) || fail
'''
install = '''
cd gcc-14.2.0/build || fail
make DESTDIR=$INSTALL install || fail
rm -v $INSTALL/usr/lib/lib{stdc++{,exp,fs},supc++}.la || fail # Remove libtool archive files, harmful for cross-compilation
'''