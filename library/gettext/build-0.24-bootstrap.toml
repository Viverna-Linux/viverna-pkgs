[metadata]
source-url = "https://ftp.gnu.org/gnu/gettext/gettext-0.24.tar.xz"
bootstrap-version = true

[build]
configure = '''
sudo -B rm -rf $ROOT/work/* || fail
mv -r gettext-0.24 $ROOT/work/ || fail
sudo -B arch-chroot $ROOT bash -c "cd /work/gettext-0.24 && ./configure --disable-shared" || fail
'''
build = '''
sudo -B arch-chroot $ROOT bash -c "cd /work/gettext-0.24 && make -j$(nproc)" || fail
'''
install = '''
sudo -B arch-chroot $ROOT bash -c "cd /work/gettext-0.24 && cp -v gettext-tools/src/{msgfmt,msgmerge,xgettext} /usr/bin" || fail
'''