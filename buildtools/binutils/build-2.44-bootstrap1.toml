[metadata]
source-url = "https://sourceware.org/pub/binutils/releases/binutils-2.44.tar.xz"
bootstrap-version = true

[build]
configure = '''
mkdir ${WORKSPACE}/binutils-2.44/build || fail
cd ${WORKSPACE}/binutils-2.44/build || fail
../configure --prefix=$INSTALL/usr           \
             --with-sysroot=$ROOT            \
             --target=$TARGET                \
             --disable-nls                   \
             --enable-gprofng=no             \
             --disable-werror                \
             --enable-new-dtags              \
             --enable-default-hash-style=gnu || fail
'''
build = '''
cd ${WORKSPACE}/binutils-2.44/build || fail
make || fail
'''
install = '''
cd ${WORKSPACE}/binutils-2.44/build || fail
make install || fail
'''