[metadata]
source-url = "https://www.nano-editor.org/dist/v8/nano-8.3.tar.xz"
bootstrap-version = true

[build]
configure = '''
sudo -B rm -rf $ROOT/work/*
mv nano-8.3 $ROOT/work/
sudo -B arch-chroot $ROOT bash -c "cd /work/nano-8.3 && ./configure --prefix=/usr --sysconfdir=/etc --enable-utf8 --docdir=/usr/share/doc/nano" || fail
'''
build = '''
sudo -B arch-chroot $ROOT bash -c "cd /work/nano-8.3 && make -j$(nproc)" || fail
'''
install = '''
sudo -B arch-chroot $ROOT bash -c "cd /work/nano-8.3 && make install && install -v -m644 doc/{nano.html,sample.nanorc} /usr/share/doc/nano && cp /usr/share/doc/nano/sample.nanorc /etc/nanorc" || fail
'''