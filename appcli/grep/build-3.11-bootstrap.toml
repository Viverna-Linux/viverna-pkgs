[metadata]
source-url = "https://ftp.gnu.org/gnu/grep/grep-3.11.tar.xz"
bootstrap-version = true

[build]
configure = '''
cd grep-3.11 || fail
sed -i 's/extras//' Makefile.in || fail

./configure --prefix=/usr \
--host=$CROSS_TARGET \
--build=$(./build-aux/config.guess) || fail
'''
build = '''
cd grep-3.11 || fail
make -j$(nproc) || fail
'''
install = '''
cd grep-3.11 || fail
make DESTDIR=$INSTALL install
'''