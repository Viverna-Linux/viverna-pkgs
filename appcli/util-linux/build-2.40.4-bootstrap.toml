[metadata]
source-url = "https://www.kernel.org/pub/linux/utils/util-linux/v2.40/util-linux-2.40.4.tar.xz"
bootstrap-version = true

[build]
configure = '''
mkdir -pv $ROOT/var/lib/hwclock
sudo -B rm -rf $ROOT/work/*
mv util-linux-2.40.4 $ROOT/work/
sudo -B arch-chroot $ROOT bash -c "cd /work/util-linux-2.40.4 && ./configure --libdir=/usr/lib --runstatedir=/run --disable-chfn-chsh --disable-login --disable-nologin --disable-su --disable-setpriv --disable-runuser --disable-pylibmount --disable-static --disable-liblastlog2 --without-python ADJTIME_PATH=/var/lib/hwclock/adjtime --docdir=/usr/share/doc/util-linux-2.40.4" || fail
'''
build = '''
sudo -B arch-chroot $ROOT bash -c "cd /work/util-linux-2.40.4 && make -j$(nproc)" || fail
'''
install = '''
sudo -B arch-chroot $ROOT bash -c "cd /work/util-linux-2.40.4 && make install" || fail
'''