[metadata]
source-url = "https://ftp.gnu.org/gnu/findutils/findutils-4.10.0.tar.xz"
bootstrap-version = true

[build]
configure = '''
cd findutils-4.10.0 || fail
./configure --prefix=/usr \
--localstatedir=/var/lib/locate \
--host=$CROSS_TARGET \
--build=$(./build-aux/config.guess) || fail
'''
build = '''
cd findutils-4.10.0 || fail
make -j$(nproc) || fail
'''
install = '''
cd findutils-4.10.0 || fail
make DESTDIR=$INSTALL install || fail
'''