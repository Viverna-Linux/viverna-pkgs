[metadata]
source-url = "https://www.cpan.org/src/5.0/perl-5.40.1.tar.xz"
bootstrap-version = true

[build]
configure = '''
sudo -B rm -rf $ROOT/work/*
mv perl-5.40.1 $ROOT/work/
sudo -B arch-chroot $ROOT bash -c "cd /work/perl-5.40.1 && sh Configure -des -D prefix=/usr -D vendorprefix=/usr -D useshrplib -D privlib=/usr/lib/perl5/5.40/core_perl -D archlib=/usr/lib/perl5/5.40/core_perl -D sitelib=/usr/lib/perl5/5.40/site_perl -D sitearch=/usr/lib/perl5/5.40/site_perl -D vendorlib=/usr/lib/perl5/5.40/vendor_perl -D vendorarch=/usr/lib/perl5/5.40/vendor_perl" || fail
'''
build = '''
sudo -B arch-chroot $ROOT bash -c "cd /work/perl-5.40.1 && make -j$(nproc)" || fail
'''
install = '''
sudo -B arch-chroot $ROOT bash -c "cd /work/perl-5.40.1 && make install" || fail
'''