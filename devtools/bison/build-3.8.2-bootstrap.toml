[metadata]
source-url = "https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.xz"
bootstrap-version = true

[build]
configure = '''
sudo -B rm -rf $ROOT/work/*
mv bison-3.8.2 $ROOT/work/
# sudo -B arch-chroot $ROOT bash -c "cd /work/bison-3.8.2 && ./configure --prefix=/usr --docdir=/usr/share/doc/bison-3.8.2" || fail
'''
build = '''
sudo -B arch-chroot $ROOT bash -c "cd /work/bison-3.8.2 && make -j$(nproc)" || fail
'''
install = '''
sudo -B arch-chroot $ROOT bash -c "cd /work/bison-3.8.2 && make install" || fail
'''