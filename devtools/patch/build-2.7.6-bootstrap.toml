[metadata]
source-url = "https://ftp.gnu.org/gnu/patch/patch-2.7.6.tar.xz"
bootstrap-version = true

[build]
configure = '''
cd patch-2.7.6 || fail
./configure --prefix=/usr \
--host=$CROSS_TARGET \
--build=$(build-aux/config.guess) || fail
'''
build = '''
cd patch-2.7.6 || fail
make -j$(nproc) || fail
'''
install = '''
cd patch-2.7.6 || fail
make DESTDIR=$INSTALL install || fail
'''