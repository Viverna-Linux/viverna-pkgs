[metadata]
source-url = "https://ftp.gnu.org/gnu/gcc/gcc-14.2.0/gcc-14.2.0.tar.xz"
bootstrap-version = true
bootstrap-oneshot = true

[build]
configure='''
cd ${WORKSPACE}/gcc-14.2.0 || fail
contrib/download_prerequisites || fail

case $(uname -m) in
    x86_64)
        sed -e '/m64=/s/lib64/lib/' \
        -i.orig gcc/config/i386/t-linux64
    ;;
esac

mkdir -v build || fail
cd build || fail
../configure \
--target=$CROSS_TARGET \
--prefix=/tools \
--with-glibc-version=2.41 \
--with-sysroot=$ROOT \
--with-newlib \
--without-headers \
--enable-default-pie \
--enable-default-ssp \
--disable-nls \
--disable-shared \
--disable-multilib \
--disable-threads \
--disable-libatomic \
--disable-libgomp \
--disable-libquadmath \
--disable-libssp \
--disable-libvtv \
--disable-libstdcxx \
--enable-languages=c,c++ || fail
'''
build = '''
cd ${WORKSPACE}/gcc-14.2.0/build || fail
make -j$(nproc) || fail
'''
install = '''
cd ${WORKSPACE}/gcc-14.2.0/build || fail
make DESTDIR=$INSTALL install || fail

cd .. || fail
cat gcc/limitx.h gcc/glimits.h gcc/limity.h > \
$INSTALL/tools/lib/gcc/${CROSS_TARGET}/14.2.0/include/limits.h || fail
'''