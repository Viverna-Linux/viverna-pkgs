[metadata]
source-url = "https://ftp.gnu.org/gnu/gcc/gcc-14.2.0/gcc-14.2.0.tar.xz"
bootstrap-version = true

[build]
configure='''
cd gcc-14.2.0 || fail
contrib/download_prerequisites || fail

case $(uname -m) in
    x86_64)
        sed -e '/m64=/s/lib64/lib/' \
        -i.orig gcc/config/i386/t-linux64
    ;;
esac

sed '/thread_header =/s/@.*@/gthr-posix.h/' \
-i libgcc/Makefile.in libstdc++-v3/include/Makefile.in || fail

mkdir -v build || fail
cd build || fail
../configure \
--build=$(../config.guess) \
--host=$CROSS_TARGET \
--target=$CROSS_TARGET \
LDFLAGS_FOR_TARGET=-L$PWD/$CROSS_TARGET/libgcc \
--prefix=/usr \
--with-build-sysroot=$ROOT \
--enable-default-pie \
--enable-default-ssp \
--disable-nls \
--disable-multilib \
--disable-libatomic \
--disable-libgomp \
--disable-libquadmath \
--disable-libsanitizer \
--disable-libssp \
--disable-libvtv \
--enable-languages=c,c++ || fail
'''
build = '''
cd gcc-14.2.0/build || fail
make -j$(nproc) || fail
'''
install = '''
cd gcc-14.2.0/build || fail
make DESTDIR=$INSTALL install || fail
ln -sv gcc $INSTALL/usr/bin/cc || fail
'''