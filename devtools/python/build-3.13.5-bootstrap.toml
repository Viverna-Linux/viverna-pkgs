[metadata]
source-url = "https://www.python.org/ftp/python/3.13.5/Python-3.13.5.tar.xz"
bootstrap-version = true

[build]
configure = '''
sudo -B rm -rf $ROOT/work/* || fail
mv Python-3.13.5 $ROOT/work/ || fail
sudo -B arch-chroot $ROOT bash -c "cd /work/Python-3.13.5 && ./configure --prefix=/usr --enable-shared" || fail
'''
build = '''
sudo -B arch-chroot $ROOT bash -c "cd /work/Python-3.13.5 && make -j$(nproc)" || fail
'''
install = '''
sudo -B arch-chroot $ROOT bash -c "cd /work/Python-3.13.5 && make install" || fail
'''